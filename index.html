<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>중1 수학: 양팔저울 방정식 마스터</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #1e293b; overflow: hidden;
    }
    #root {
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center; padding: 12px;
    }

    .game-window {
      width: 100%; max-width: 1280px; height: 100%; max-height: 860px;
      background: #f8fafc; border-radius: 22px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.45), 0 0 0 3px rgba(255,255,255,0.1);
      display: flex; flex-direction: column; overflow: hidden; position: relative;
    }

    /* 1. 상단 헤더 바 */
    .header-bar {
      background: #0f172a; color: white;
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 16px; flex-shrink: 0; gap: 8px; flex-wrap: wrap;
    }
    .brand { font-size: 1.05rem; font-weight: 900; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    
    .stage-nav {
      display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none;
      max-width: 100%; padding: 2px 0;
    }
    .stage-nav::-webkit-scrollbar { display: none; }
    .stage-pill {
      padding: 6px 11px; border-radius: 16px; border: 1px solid #334155;
      background: #1e293b; color: #94a3b8; font-weight: 800; font-size: 0.78rem;
      cursor: pointer; transition: 0.2s; white-space: nowrap; flex-shrink: 0;
    }
    .stage-pill.tutorial-pill { border-color: #f59e0b; color: #fcd34d; }
    .stage-pill.active {
      background: #3b82f6; color: white; border-color: #60a5fa;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }
    .stage-pill.tutorial-pill.active {
      background: #f59e0b; color: #0f172a; border-color: #fde047;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }

    .header-stats { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 800; }
    .stat-chip {
      background: #1e293b; padding: 5px 10px; border-radius: 12px;
      border: 1px solid #334155; display: flex; align-items: center; gap: 4px; white-space: nowrap;
    }
    .icon-btn {
      background: #1e293b; border: 1px solid #334155; color: white;
      height: 30px; padding: 0 10px; border-radius: 12px; cursor: pointer; font-size: 0.78rem;
      font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .mobile-only-btn { display: none; }

    /* 2. 메인 바디 */
    .main-workspace {
      flex: 1; display: grid; grid-template-columns: 1fr 300px;
      overflow: hidden; position: relative; min-height: 0;
    }

    .canvas-section {
      display: flex; flex-direction: column; justify-content: space-between;
      align-items: center; padding: 12px 18px; position: relative;
      background: radial-gradient(circle at 50% 45%, #ffffff 0%, #e2e8f0 100%);
      overflow: hidden; min-height: 0;
    }

    /* 상단 목표 가이드 & 수식 전광판 HUD */
    .canvas-hud {
      width: 100%; display: flex; justify-content: space-between; align-items: flex-start;
      z-index: 10; gap: 10px; flex-shrink: 0;
    }
    .goal-guide-card {
      background: white; padding: 9px 14px; border-radius: 14px;
      border: 2px solid #3b82f6; flex: 1; max-width: 390px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
    }
    .goal-guide-card.tutorial-card { border-color: #f59e0b; background: #fffbeb; }
    .goal-guide-card.split-card { border-color: #8b5cf6; background: #f5f3ff; }
    .goal-badge {
      display: inline-block; font-size: 0.7rem; font-weight: 900;
      padding: 2px 7px; border-radius: 6px; margin-bottom: 3px;
      background: #dbeafe; color: #1d4ed8;
    }
    .tutorial-card .goal-badge { background: #fef3c7; color: #b45309; }
    .split-card .goal-badge { background: #ede9fe; color: #6d28d9; }
    .goal-title { font-size: 0.84rem; font-weight: 900; color: #0f172a; line-height: 1.32; }
    .goal-sub { font-size: 0.74rem; color: #475569; margin-top: 3px; font-weight: 600; }

    .hud-right-group {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .equation-hud {
      background: white; padding: 6px 22px; border-radius: 16px;
      border: 3px solid #cbd5e1; font-size: 1.65rem; font-weight: 900;
      display: flex; align-items: center; gap: 12px; white-space: nowrap;
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
    }
    .sign-badge {
      width: 34px; height: 34px; border-radius: 9px; color: white; font-size: 1.25rem;
      display: flex; align-items: center; justify-content: center;
    }
    .sign-badge.equal { background: #16a34a; }
    .sign-badge.unequal { background: #dc2626; }

    .moves-hud {
      background: #fffbeb; border: 2px solid #fde68a; border-radius: 12px;
      padding: 6px 12px; text-align: right; white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }
    .moves-hud .count { font-size: 0.88rem; font-weight: 900; color: #d97706; }
    .moves-hud .target { font-size: 0.7rem; color: #92400e; font-weight: 700; }

    /* ★ 중앙 양팔저울 무대 (JS 동적 스케일링 래퍼) */
    .scale-stage-center {
      flex: 1; width: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; position: relative; min-height: 0;
    }
    /* 실제 스케일에 맞춰 크기가 정확히 줄어드는 컨테이너 */
    .scale-sizer {
      position: relative; display: flex; justify-content: center; align-items: center;
    }
    .scale-area {
      position: absolute; width: 580px; height: 290px;
      display: flex; justify-content: center;
      transform-origin: center center;
    }
    .scale-beam {
      width: 420px; height: 16px;
      background: linear-gradient(180deg, #fcd34d 0%, #d97706 100%);
      border: 2px solid #92400e; border-radius: 10px;
      position: relative; top: 92px; z-index: 3;
      box-shadow: 0 6px 14px rgba(0,0,0,0.18);
      transition: transform 0.7s cubic-bezier(0.34, 1.55, 0.64, 1);
    }
    .scale-pointer {
      width: 8px; height: 40px; background: linear-gradient(180deg, #ef4444, #991b1b);
      position: absolute; left: 50%; top: -32px; transform: translateX(-50%);
      border-radius: 4px 4px 0 0; border: 1px solid #7f1d1d;
    }
    .scale-center-cap {
      width: 30px; height: 30px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef08a, #b45309);
      border: 2px solid #78350f; position: absolute; left: 50%; top: -9px;
      transform: translateX(-50%);
    }
    .scale-stand {
      width: 28px; height: 185px;
      background: linear-gradient(90deg, #475569 0%, #94a3b8 45%, #1e293b 100%);
      position: absolute; top: 92px; z-index: 2; border-radius: 8px 8px 0 0;
    }
    .scale-base {
      width: 200px; height: 22px;
      background: linear-gradient(180deg, #475569 0%, #0f172a 100%);
      position: absolute; top: 268px; z-index: 2; border-radius: 14px 14px 4px 4px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    .plate-wrapper {
      position: absolute; bottom: 14px; width: 180px;
      display: flex; flex-direction: column; align-items: center;
      transition: transform 0.7s cubic-bezier(0.34, 1.55, 0.64, 1);
    }
    .plate-wrapper.left { left: -90px; }
    .plate-wrapper.right { right: -90px; }
    
    .plate {
      width: 170px; height: 16px;
      background: linear-gradient(180deg, #f1f5f9 0%, #64748b 100%);
      border-radius: 4px 4px 26px 26px; border-top: 3px solid #ffffff;
      box-shadow: 0 8px 16px rgba(0,0,0,0.18);
    }
    .plate-pillar { width: 8px; height: 14px; background: #92400e; }

    .plate-role-tag {
      position: absolute; bottom: -25px; font-size: 0.72rem; font-weight: 800;
      padding: 3px 9px; border-radius: 10px; white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .tag-x-goal { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .tag-num-goal { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }

    .items-box {
      display: flex; flex-wrap: wrap-reverse; justify-content: center;
      align-content: flex-start; gap: 5px; width: 170px; min-height: 50px; padding-bottom: 4px;
    }

    /* 아이템 그래픽 */
    .item {
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; cursor: pointer; position: relative;
      animation: itemDrop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      transition: transform 0.15s;
    }
    .item:hover { transform: scale(1.18) translateY(-3px); z-index: 10; }
    .box-x {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, #fde047 0%, #f59e0b 100%);
      color: #78350f; border: 2px solid #b45309; border-radius: 9px; font-size: 1.2rem;
      box-shadow: inset 0 2px 3px rgba(255,255,255,0.8), 0 4px 6px rgba(0,0,0,0.15);
    }
    .box-gift {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #c084fc 0%, #7e22ce 100%);
      color: white; border: 2px solid #581c87; border-radius: 9px; font-size: 1.25rem;
      box-shadow: inset 0 2px 3px rgba(255,255,255,0.6), 0 4px 8px rgba(126, 34, 206, 0.3);
    }
    .weight-pos.distractor, .balloon-neg.distractor {
      outline: 2px dashed rgba(239, 68, 68, 0.65); outline-offset: 2px;
    }
    .box-x.opened {
      background: linear-gradient(135deg, #dcfce7 0%, #86efac 100%);
      border: 2px dashed #16a34a; color: #15803d; width: auto; padding: 4px 10px; font-size: 1rem;
    }
    .box-neg-x {
      width: 38px; height: 42px;
      background: radial-gradient(circle at 30% 30%, #fda4af, #e11d48);
      color: white; border: 2px solid #9f1239; border-radius: 50% 50% 42% 42%;
      margin-bottom: 10px; font-size: 0.95rem; animation: floatBalloon 2.2s ease-in-out infinite;
    }
    .weight-pos {
      width: 30px; height: 28px;
      background: linear-gradient(180deg, #60a5fa 0%, #1d4ed8 100%);
      border: 2px solid #1e3a8a; border-radius: 7px 7px 4px 4px;
      color: white; font-size: 0.82rem; margin-top: 6px;
      box-shadow: inset 0 2px 2px rgba(255,255,255,0.5), 0 4px 6px rgba(0,0,0,0.2);
    }
    .weight-pos::before {
      content: ''; position: absolute; top: -6px; width: 11px; height: 5px;
      border: 2px solid #1e3a8a; border-bottom: none; border-radius: 8px 8px 0 0;
    }
    .balloon-neg {
      width: 30px; height: 36px;
      background: radial-gradient(circle at 30% 30%, #ff8787, #dc2626 80%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      color: white; font-size: 0.82rem; margin-bottom: 12px;
      box-shadow: 0 6px 12px rgba(220, 38, 38, 0.25);
      animation: floatBalloon 2s ease-in-out infinite;
    }
    .balloon-neg::after {
      content: ''; position: absolute; bottom: -10px; width: 1.5px; height: 10px; background: #94a3b8;
    }

    .poof-effect {
      position: absolute; bottom: 25px; z-index: 20;
      background: radial-gradient(circle, #ffffff 20%, #fde047 60%, transparent 100%);
      padding: 8px 14px; border-radius: 30px; font-weight: 900; color: #dc2626;
      font-size: 0.95rem; animation: poofAnim 0.55s ease-out forwards; pointer-events: none;
    }

    /* 빈 저울 추가 & 수동 나눠 담기 워크스페이스 */
    .multi-scales-workspace {
      display: flex; flex-direction: column; align-items: center; width: 100%;
      animation: fadeIn 0.3s ease; max-height: 100%; overflow-y: auto; padding: 4px;
    }
    .mini-scales-container {
      display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%; flex-wrap: wrap;
    }
    .mini-scale-card {
      background: rgba(255,255,255,0.95); border: 2px dashed #cbd5e1; border-radius: 16px;
      padding: 8px 10px; display: flex; flex-direction: column; align-items: center;
      transition: all 0.25s; position: relative;
    }
    .mini-scale-card.source-card { border: 2px solid #3b82f6; background: #eff6ff; }
    .mini-scale-card.equal-ready {
      border: 3px solid #10b981; background: #ecfdf5;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.18);
    }
    .mini-badge {
      font-size: 0.68rem; font-weight: 900; padding: 3px 8px; border-radius: 8px;
      background: #64748b; color: white; text-align: center;
    }
    .source-card .mini-badge { background: #2563eb; }
    .equal-ready .mini-badge { background: #059669; }

    .split-control-bar {
      display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
      background: white; padding: 7px 14px; border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #e2e8f0;
    }

    /* 3. 슬림 하단 플로팅 액션 독 */
    .floating-dock {
      background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(12px);
      padding: 8px 14px; border-radius: 18px; color: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.15);
      display: flex; align-items: center; gap: 10px; z-index: 15;
      flex-wrap: wrap; justify-content: center; flex-shrink: 0; width: 100%; max-width: 920px;
    }
    .dock-section {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 10px 3px 4px; border-right: 1px solid #334155;
      border-radius: 8px; transition: 0.2s;
    }
    .dock-section:last-child { border-right: none; padding-right: 0; }
    .dock-section.needs-select {
      background: rgba(250, 204, 21, 0.12);
      outline: 1.5px dashed #facc15;
    }
    .dock-label { font-size: 0.72rem; color: #94a3b8; font-weight: 700; margin-right: 2px; white-space: nowrap; }
    .needs-select .dock-label { color: #fde047; }

    .dock-btn {
      padding: 7px 11px; border: none; border-radius: 9px;
      font-weight: 800; font-size: 0.8rem; cursor: pointer; transition: 0.12s;
      display: flex; align-items: center; gap: 4px; white-space: nowrap;
    }
    .dock-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .dock-btn.locked-action { opacity: 0.5; filter: grayscale(0.3); }
    .dock-btn.pulse-highlight { outline: 3px solid #fde047; animation: pulse 1.2s infinite; }

    .d-pos { background: #3b82f6; color: white; }
    .d-neg { background: #ef4444; color: white; }
    .d-xpos { background: #facc15; color: #0f172a; }
    .d-xneg { background: #fb7185; color: white; }
    .d-div { background: #8b5cf6; color: white; }
    .d-green { background: #10b981; color: white; }
    .d-util { background: #334155; color: #e2e8f0; }

    .num-chip {
      width: 27px; height: 27px; border-radius: 7px; border: 1px solid #475569;
      background: #1e293b; color: #cbd5e1; font-weight: 800; font-size: 0.78rem;
      cursor: pointer; transition: 0.12s; display: flex; align-items: center; justify-content: center;
    }
    .num-chip.active {
      background: #38bdf8; color: #0f172a; border-color: #bae6fd;
      transform: scale(1.06); box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }

    .sync-chip {
      display: flex; align-items: center; gap: 4px; font-size: 0.78rem; font-weight: 800;
      background: #1e293b; padding: 5px 9px; border-radius: 7px; cursor: pointer;
      border: 1px solid #475569; color: #cbd5e1; transition: 0.12s; white-space: nowrap;
    }
    .sync-chip.active {
      background: #0284c7; color: white; border-color: #7dd3fc;
      box-shadow: 0 0 8px rgba(2, 132, 199, 0.5);
    }

    /* 우측 사이드바: 실시간 수학 풀이 공책 */
    .notebook-sidebar {
      background: #ffffff; border-left: 2px solid #e2e8f0;
      display: flex; flex-direction: column; height: 100%; overflow: hidden;
    }
    .notebook-header {
      padding: 12px 16px; background: #f1f5f9; border-bottom: 1px solid #e2e8f0;
      font-weight: 900; font-size: 0.9rem; color: #334155;
      display: flex; justify-content: space-between; align-items: center;
    }
    .notebook-body {
      flex: 1; padding: 12px; overflow-y: auto;
      background-image: linear-gradient(#f1f5f9 1px, transparent 1px);
      background-size: 100% 30px;
      display: flex; flex-direction: column; gap: 7px;
    }
    .log-step {
      background: rgba(255,255,255,0.92); border: 1px solid #e2e8f0;
      border-left: 4px solid #3b82f6; border-radius: 8px; padding: 7px 10px;
      animation: fadeIn 0.25s ease;
    }
    .log-action { font-size: 0.72rem; color: #64748b; font-weight: 700; margin-bottom: 2px; }
    .log-eq { font-size: 1rem; font-weight: 900; color: #0f172a; }
    .notebook-footer {
      padding: 10px 14px; background: #f8fafc; border-top: 1px solid #e2e8f0;
      font-size: 0.74rem; color: #64748b; line-height: 1.35;
    }

    /* 클리어 오버레이 배너 */
    .clear-floating-banner {
      position: absolute; top: 75px; z-index: 25;
      background: rgba(236, 253, 245, 0.98); backdrop-filter: blur(8px);
      border: 2px solid #10b981; border-radius: 16px; padding: 10px 20px;
      display: flex; align-items: center; gap: 14px; max-width: 94%;
      box-shadow: 0 12px 30px rgba(16, 185, 129, 0.28);
      animation: popBounce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 모달 팝업 (문제 직접 만들기 & 모바일 노트) */
    .modal-backdrop {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px); z-index: 50;
      display: flex; justify-content: center; align-items: center; padding: 16px;
    }
    .modal-card {
      background: white; border-radius: 20px; width: 100%; max-width: 420px;
      padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      animation: popBounce 0.25s ease;
    }
    .modal-card h3 { margin: 0 0 12px 0; font-size: 1.1rem; color: #0f172a; }
    .custom-input-row {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      background: #f1f5f9; padding: 12px; border-radius: 12px; margin-bottom: 12px;
      font-weight: 900; font-size: 1.1rem; flex-wrap: wrap;
    }
    .custom-input-row input {
      width: 48px; height: 36px; text-align: center; font-weight: 900; font-size: 1rem;
      border: 2px solid #cbd5e1; border-radius: 8px;
    }

    /* ★ 스마트폰/태블릿 세로 모드 완벽 대응 */
    @media (max-width: 900px) {
      #root { padding: 0; }
      .game-window {
        border-radius: 0; max-height: none; height: 100%;
      }
      .header-bar { padding: 6px 10px; gap: 6px; }
      .brand { font-size: 0.92rem; }
      .stage-nav { order: 3; width: 100%; padding-top: 2px; }
      .stage-pill { padding: 4px 9px; font-size: 0.72rem; }
      .mobile-only-btn { display: flex; }

      .main-workspace {
        grid-template-columns: 1fr; /* 우측 공책 숨기고 1단 전체 화면 사용 */
      }
      .notebook-sidebar { display: none; }
      .notebook-sidebar.mobile-open {
        display: flex; position: absolute; inset: 0; z-index: 45;
      }

      .canvas-section { padding: 8px 10px; }
      .canvas-hud {
        flex-direction: column; align-items: stretch; gap: 6px;
      }
      .hud-right-group {
        order: -1; width: 100%; justify-content: space-between;
      }
      .equation-hud {
        font-size: 1.25rem; padding: 4px 14px; gap: 8px; flex: 1; justify-content: center;
      }
      .sign-badge { width: 28px; height: 28px; font-size: 1rem; }
      .moves-hud { padding: 4px 10px; }
      .moves-hud .count { font-size: 0.8rem; }
      .moves-hud .target { font-size: 0.65rem; }

      .goal-guide-card {
        max-width: 100%; padding: 7px 10px; border-radius: 10px;
      }
      .goal-badge { font-size: 0.65rem; padding: 1px 6px; }
      .goal-title { font-size: 0.78rem; }
      .goal-sub { font-size: 0.68rem; }

      .clear-floating-banner {
        top: 52px; padding: 8px 12px; gap: 8px; flex-wrap: wrap; justify-content: center;
      }

      /* 하단 플로팅 독 모바일 최적화 (컴팩트 3줄 구성) */
      .floating-dock {
        padding: 7px 8px; gap: 5px; border-radius: 14px;
      }
      .dock-section {
        border-right: none; padding: 2px 4px; justify-content: center;
      }
      .dock-label { font-size: 0.68rem; }
      .sync-chip, .num-chip { font-size: 0.73rem; height: 25px; }
      .num-chip { width: 25px; }
      .dock-btn { padding: 6px 9px; font-size: 0.74rem; }
    }

    @keyframes itemDrop { 0% { transform: translateY(-25px) scale(0.5); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes floatBalloon { 0%, 100% { transform: translateY(0px) rotate(-1deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
    @keyframes poofAnim { 0% { transform: scale(0.4); opacity: 1; } 100% { transform: scale(1.5) translateY(-20px); opacity: 0; } }
    @keyframes popBounce { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes fadeIn { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 사운드 엔진
    const SoundFX = {
      ctx: null, muted: false,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      playTone(freq, type, duration, endFreq = null, vol = 0.15) {
        if (this.muted) return;
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, this.ctx.currentTime + duration);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      },
      selectPop() { this.playTone(500, 'sine', 0.06, 600, 0.1); },
      heavyDrop() { this.playTone(180, 'triangle', 0.14, 70, 0.25); },
      balloonFloat() { this.playTone(350, 'sine', 0.16, 650, 0.15); },
      moveItem() { this.playTone(420, 'sine', 0.1, 580, 0.15); },
      zeroPairPoof() { this.playTone(520, 'sawtooth', 0.22, 120, 0.2); },
      divideMagic() { [440, 554, 659].forEach((f, i) => setTimeout(() => this.playTone(f, 'sine', 0.2, null, 0.12), i * 70)); },
      error() { this.playTone(150, 'sawtooth', 0.25, 110, 0.2); },
      winFanfare() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => this.playTone(f, 'triangle', 0.35, null, 0.2), i * 110)); }
    };

    // Stage 0 튜토리얼 (등식의 성질 4단계)
    const TUTORIAL_STEPS = [
      {
        step: 1,
        title: "미션 1/4: 한쪽 접시만 건드려보기",
        instruction: "현재 3 = 3 으로 수평입니다. 만약 왼쪽 접시에만 추 2개를 더 올리면(5 > 3) 어떻게 될까요?",
        subHint: "하단에서 [① 대상]과 [② 개수]를 알맞게 직접 골라 추를 올려보세요!",
        initLeft: { x: 0, num: 3 }, initRight: { x: 0, num: 3 },
        secretVal: 1,
        checkClear: (l, r) => l.num === 5 && r.num === 3,
        clearComment: "맞아요! 한쪽에만 추를 올리면 저울이 기울어져서 등식(=)이 깨집니다!"
      },
      {
        step: 2,
        title: "미션 2/4: 등식의 성질 1 (같은 수 더하기)",
        instruction: "5 > 3 으로 기울어진 저울을 다시 [ 5 = 5 ] 수평으로 만들려면, 어느 쪽 접시에 추를 몇 개 올려야 할까요?",
        subHint: "기울어진 저울을 보고 [① 대상]과 [② 개수]를 스스로 판단해 선택해 보세요!",
        initLeft: { x: 0, num: 5 }, initRight: { x: 0, num: 3 },
        secretVal: 1,
        checkClear: (l, r) => l.num === 5 && r.num === 5,
        clearComment: "성공! 양변에 같은 수를 더하면 등식은 그대로 성립합니다!"
      },
      {
        step: 3,
        title: "미션 3/4: 등식의 성질 2 (풍선을 달아 양변에서 동시에 빼기)",
        instruction: "현재 5 = 5 입니다. 저울의 수평이 깨지지 않게 풍선(-1)을 달아서 한 번에 [ 2 = 2 ] 를 만들어 보세요!",
        subHint: "수평을 유지하려면 어디에 몇 개의 풍선(-1)을 달아야 할지 직접 선택해 보세요.",
        initLeft: { x: 0, num: 5 }, initRight: { x: 0, num: 5 },
        secretVal: 1,
        checkClear: (l, r) => l.num === 2 && r.num === 2,
        clearComment: "완벽해요! 양변에 똑같은 개수의 풍선(-)을 달아 추를 없애도 수평(=)은 유지됩니다!"
      },
      {
        step: 4,
        title: "미션 4/4: 등식의 성질 4 (뺄셈이 안 될 때는 똑같이 나누기!)",
        instruction: "왼쪽엔 [🎁 선물상자 2개], 오른쪽엔 [추 6개]가 있어요! 수평을 유지하며 선물상자 1개의 무게(🎁 = 3)를 어떻게 알아낼 수 있을까요?",
        subHint: "오른쪽만 빼면 저울이 기울어져요! [⚖️ 빈 저울 가져오기]를 눌러 저울 2대에 똑같이 나누어 담아보세요!",
        initLeft: { x: 2, num: 0 }, initRight: { x: 0, num: 6 },
        secretVal: 3,
        isGiftBox: true,
        checkClear: (l, r, isSplitMode) => !isSplitMode && l.x === 1 && l.num === 0 && r.num === 3,
        clearComment: "🎓 유레카! 양변에서 똑같이 뺄 수 없을 때는 '빈 저울에 똑같이 나누어 담기(나눗셈)'로 상자 1개의 무게를 구할 수 있군요! 이제 방정식으로 출발합니다!"
      }
    ];

    const STAGES = [
      { id: 0, name: "🌟 Stage 0: 등식의 성질", isTutorial: true },
      { id: 1, name: "Stage 1: 덧셈" },
      { id: 2, name: "Stage 2: 곱셈" },
      { id: 3, name: "Stage 3: 2단계" },
      { id: 4, name: "Stage 4: 양변 x" },
      { id: 5, name: "Stage 5: 음수" }
    ];

    const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    function formatSide(plate, isGift = false) {
      const parts = [];
      const sym = isGift ? "🎁" : "x";
      if (plate.x !== 0) {
        if (plate.x === 1) parts.push(sym);
        else if (plate.x === -1) parts.push(`-${sym}`);
        else parts.push(`${plate.x}${sym}`);
      }
      if (plate.num !== 0) {
        if (plate.num > 0 && parts.length > 0) parts.push(`+ ${plate.num}`);
        else if (plate.num < 0 && parts.length > 0) parts.push(`- ${Math.abs(plate.num)}`);
        else parts.push(`${plate.num}`);
      }
      return parts.length > 0 ? parts.join(" ") : "0";
    }

    // ★ 화면 폭에 맞춰 자동으로 정확한 비율과 크기를 잡아주는 ScaleView
    function ScaleView({
      left, right, tiltAngle, isCleared, secretX, poofSide,
      tempBalloons = { left: 0, right: 0, leftX: 0, rightX: 0 },
      onItemClick, stage, isGiftBox = false, showRoleTag = true, scaleFactor = 1
    }) {
      const renderItems = (plate, side) => {
        const items = [];
        const hasXOnThisPlate = plate.x !== 0;

        for (let i = 0; i < Math.abs(plate.x); i++) {
          if (isCleared && (stage > 0 || isGiftBox) && plate.x === 1 && plate.num === 0) {
            items.push(
              <div key={`${side}-x-open`} className="item box-x opened">
                {isGiftBox ? `🎁 = ${secretX}` : `📦 x = ${secretX}`}
              </div>
            );
          } else {
            const isPos = plate.x > 0;
            items.push(
              <div
                key={`${side}-x-${i}`}
                className={`item ${isGiftBox ? 'box-gift' : (isPos ? 'box-x' : 'box-neg-x')}`}
                onClick={() => onItemClick && onItemClick(side, 'x', isPos ? -1 : 1)}
              >
                {isGiftBox ? '🎁' : (isPos ? 'x' : '-x')}
              </div>
            );
          }
        }
        for (let i = 0; i < Math.abs(plate.num); i++) {
          const isPos = plate.num > 0;
          items.push(
            <div
              key={`${side}-n-${i}`}
              className={`item ${isPos ? 'weight-pos' : 'balloon-neg'} ${hasXOnThisPlate ? 'distractor' : ''}`}
              onClick={() => onItemClick && onItemClick(side, 'num', isPos ? -1 : 1)}
            >
              {isPos ? '1' : '-1'}
            </div>
          );
        }

        // 양수 추(+1)를 없애기 위해 날아온 임시 풍선(-1) 렌더링
        const extraBalloons = tempBalloons[side] || 0;
        for (let i = 0; i < extraBalloons; i++) {
          items.push(
            <div key={`${side}-temp-b-${i}`} className="item balloon-neg" style={{ outline: '2px solid #fde047', zIndex: 15 }}>
              -1
            </div>
          );
        }

        // ★ 보완: 양수 상자(+x)를 없애기 위해 날아온 임시 마이너스 상자 풍선(-x) 렌더링
        const extraXBalloons = tempBalloons[`${side}X`] || 0;
        for (let i = 0; i < extraXBalloons; i++) {
          items.push(
            <div key={`${side}-temp-xb-${i}`} className="item box-neg-x" style={{ outline: '2px solid #fde047', zIndex: 15 }}>
              -x
            </div>
          );
        }

        return items;
      };

      const baseW = 580;
      const baseH = 305;

      return (
        <div className="scale-sizer" style={{ width: `${baseW * scaleFactor}px`, height: `${baseH * scaleFactor}px` }}>
          <div className="scale-area" style={{ transform: `scale(${scaleFactor})` }}>
            <div className="scale-beam" style={{ transform: `rotate(${tiltAngle}deg)` }}>
              <div className="scale-pointer" />
              <div className="scale-center-cap" />

              <div className="plate-wrapper left" style={{ transform: `rotate(${-tiltAngle}deg)` }}>
                {(poofSide === 'left' || poofSide === 'both') && <div className="poof-effect">💥 펑! (0 상쇄)</div>}
                <div className="items-box">{renderItems(left, 'left')}</div>
                <div className="plate" />
                <div className="plate-pillar" />
                {(stage > 0 || isGiftBox) && showRoleTag && (
                  <div className="plate-role-tag tag-x-goal">
                    🎯 목표: [{isGiftBox ? '🎁 상자' : '📦 x'}] 1개만 남기기
                  </div>
                )}
              </div>

              <div className="plate-wrapper right" style={{ transform: `rotate(${-tiltAngle}deg)` }}>
                {(poofSide === 'right' || poofSide === 'both') && <div className="poof-effect">💥 펑! (0 상쇄)</div>}
                <div className="items-box">{renderItems(right, 'right')}</div>
                <div className="plate" />
                <div className="plate-pillar" />
                {(stage > 0 || isGiftBox) && showRoleTag && (
                  <div className="plate-role-tag tag-num-goal">🔢 목표: 숫자 추만 남기기</div>
                )}
              </div>
            </div>
            <div className="scale-stand" />
            <div className="scale-base" />
          </div>
        </div>
      );
    }

    function App() {
      const [stage, setStage] = useState(0);
      const [tutIdx, setTutIdx] = useState(0);

      const [secretX, setSecretX] = useState(1);
      const [initialState, setInitialState] = useState(null);
      const [left, setLeft] = useState({ x: 0, num: 3 });
      const [right, setRight] = useState({ x: 0, num: 3 });
      
      const [targetSide, setTargetSide] = useState(null);
      const [stepSize, setStepSize] = useState(null);

      const [moves, setMoves] = useState(0);
      const [optimalMoves, setOptimalMoves] = useState(1);
      const [lastActionKey, setLastActionKey] = useState(null);
      
      // ★ 로컬 스토리지 연동으로 새로고침해도 별점과 콤보 유지
      const [totalStars, setTotalStars] = useState(() => Number(localStorage.getItem('math_scale_stars') || 0));
      const [streak, setStreak] = useState(() => Number(localStorage.getItem('math_scale_streak') || 0));
      const [bestStarsThisProb, setBestStarsThisProb] = useState(0);
      const [muted, setMuted] = useState(false);

      const [msg, setMsg] = useState("");
      const [poofSide, setPoofSide] = useState(null);
      const [tempBalloons, setTempBalloons] = useState({ left: 0, right: 0, leftX: 0, rightX: 0 });
      const [isAnimating, setIsAnimating] = useState(false);
      const [history, setHistory] = useState([]);
      const [multiScales, setMultiScales] = useState(null);

      // 모바일 화면 크기 측정 및 모달 상태
      const [winSize, setWinSize] = useState({ w: window.innerWidth, h: window.innerHeight });
      const [showMobileNote, setShowMobileNote] = useState(false);
      const [showCustomModal, setShowCustomModal] = useState(false);
      const [customForm, setCustomForm] = useState({ lx: 2, lnum: 1, rx: 0, xval: 3 });

      useEffect(() => {
        const onResize = () => setWinSize({ w: window.innerWidth, h: window.innerHeight });
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);

      useEffect(() => {
        localStorage.setItem('math_scale_stars', totalStars);
        localStorage.setItem('math_scale_streak', streak);
      }, [totalStars, streak]);

      // ★ 기기 화면 폭과 높이에 맞춰 저울의 배율(scaleFactor)을 정밀 자동 계산
      const isMobile = winSize.w <= 900;
      const mainScaleFactor = isMobile
        ? Math.min(0.85, Math.max(0.48, (winSize.w - 28) / 580, (winSize.h - 380) / 310))
        : Math.min(1.06, Math.max(0.75, (winSize.w - 360) / 600));
      const miniScaleFactor = isMobile
        ? Math.min(0.38, Math.max(0.24, (winSize.w * 0.44) / 580))
        : 0.41;

      const isGiftBoxMode = stage === 0 && TUTORIAL_STEPS[tutIdx]?.isGiftBox;

      const getOptimal = (l, r) => {
        let steps = 0;
        if (l.x !== 0 && r.x !== 0) steps += 1;
        const xOnLeft = Math.abs(l.x) >= Math.abs(r.x);
        if (xOnLeft && l.num !== 0) steps += 1;
        else if (!xOnLeft && r.num !== 0) steps += 1;
        if (Math.abs(l.x - r.x) > 1) steps += 1;
        return Math.max(1, steps);
      };

      const resetSelections = () => {
        setTargetSide(null);
        setStepSize(null);
      };

      const loadTutorialStep = (idx) => {
        const t = TUTORIAL_STEPS[idx];
        setSecretX(t.secretVal || 1);
        setLeft({ ...t.initLeft }); setRight({ ...t.initRight });
        setInitialState({ left: { ...t.initLeft }, right: { ...t.initRight } });
        resetSelections();
        setOptimalMoves(1); setMoves(0); setLastActionKey(null);
        setMultiScales(null); setBestStarsThisProb(0); setMsg("");
        setTempBalloons({ left: 0, right: 0, leftX: 0, rightX: 0 }); setIsAnimating(false);
        const lW = t.initLeft.x * (t.secretVal || 1) + t.initLeft.num;
        const rW = t.initRight.x * (t.secretVal || 1) + t.initRight.num;
        const signStr = lW === rW ? '=' : '>';
        setHistory([{ action: t.title, eq: `${formatSide(t.initLeft, t.isGiftBox)} ${signStr} ${formatSide(t.initRight, t.isGiftBox)}` }]);
      };

      const generateProblem = (currentStage) => {
        if (currentStage === 0) {
          loadTutorialStep(0); setTutIdx(0); return;
        }
        let xVal, l, r;
        // 직전 문제와 완전히 똑같은 식이 연속으로 나오지 않도록 중복 방지 루프
        for (let attempt = 0; attempt < 5; attempt++) {
          xVal = rand(1, 4);
          l = { x: 0, num: 0 }; r = { x: 0, num: 0 };

          if (currentStage === 1) {
            const a = rand(1, 5);
            l = { x: 1, num: a }; r = { x: 0, num: xVal + a };
          } else if (currentStage === 2) {
            const a = rand(2, 3);
            l = { x: a, num: 0 }; r = { x: 0, num: a * xVal };
          } else if (currentStage === 3) {
            const a = rand(2, 3), b = rand(1, 4);
            l = { x: a, num: b }; r = { x: 0, num: a * xVal + b };
          } else if (currentStage === 4) {
            const c = rand(1, 2), a = c + rand(1, 2), b = rand(1, 4);
            const d = (a - c) * xVal + b;
            l = { x: a, num: b }; r = { x: c, num: d };
          } else if (currentStage === 5) {
            const a = rand(1, 3), b = rand(-4, -1);
            const c = a > 1 ? rand(0, a - 1) : 0;
            const d = (a - c) * xVal + b;
            l = { x: a, num: b }; r = { x: c, num: d };
          }
          if (!initialState || l.x !== initialState.left.x || l.num !== initialState.left.num || r.num !== initialState.right.num) break;
        }

        setSecretX(xVal);
        setLeft(l); setRight(r);
        setInitialState({ left: { ...l }, right: { ...r } });
        setOptimalMoves(getOptimal(l, r));
        resetSelections();
        setMoves(0); setLastActionKey(null);
        setMultiScales(null); setBestStarsThisProb(0); setMsg("");
        setTempBalloons({ left: 0, right: 0, leftX: 0, rightX: 0 }); setIsAnimating(false);
        setHistory([{ action: "처음 주어진 방정식", eq: `${formatSide(l)} = ${formatSide(r)}` }]);
      };

      // 선생님/학생 직접 문제 만들기 적용 함수
      const applyCustomProblem = () => {
        const xVal = Math.max(1, Math.min(6, Number(customForm.xval) || 2));
        const lx = Math.max(1, Math.min(4, Number(customForm.lx) || 1));
        const lnum = Math.max(-5, Math.min(6, Number(customForm.lnum) || 0));
        const rx = Math.max(0, Math.min(lx - 1, Number(customForm.rx) || 0));
        const rnum = (lx - rx) * xVal + lnum;

        const l = { x: lx, num: lnum };
        const r = { x: rx, num: rnum };
        if (stage === 0) setStage(3);
        setSecretX(xVal);
        setLeft(l); setRight(r);
        setInitialState({ left: { ...l }, right: { ...r } });
        setOptimalMoves(getOptimal(l, r));
        resetSelections();
        setMoves(0); setLastActionKey(null);
        setMultiScales(null); setBestStarsThisProb(0); setMsg("");
        setHistory([{ action: "✏️ 직접 만든 방정식", eq: `${formatSide(l)} = ${formatSide(r)}` }]);
        setShowCustomModal(false);
      };

      useEffect(() => { generateProblem(stage); }, [stage]);

      const leftWeight = left.x * secretX + left.num;
      const rightWeight = right.x * secretX + right.num;
      const weightDiff = rightWeight - leftWeight;
      const tiltAngle = Math.max(-18, Math.min(18, weightDiff * 4));

      const isCleared = stage === 0
        ? TUTORIAL_STEPS[tutIdx].checkClear(left, right, !!multiScales)
        : (!multiScales && leftWeight === rightWeight && 
          ((left.x === 1 && left.num === 0 && right.x === 0) || 
           (right.x === 1 && right.num === 0 && left.x === 0)));

      const getEarnedStars = (m) => m <= optimalMoves ? 3 : (m <= optimalMoves + 2 ? 2 : 1);

      useEffect(() => {
        if (isCleared) {
          SoundFX.winFanfare();
          const stars = stage === 0 ? 3 : getEarnedStars(moves);
          if (stars > bestStarsThisProb) {
            setTotalStars(prev => prev + (stars - bestStarsThisProb));
            setBestStarsThisProb(stars);
          }
          if (stars === 3) {
            setStreak(prev => prev + 1);
            if (window.confetti) window.confetti({ particleCount: 70, spread: 65, origin: { y: 0.6 } });
          } else if (bestStarsThisProb === 0) setStreak(0);
        }
      }, [isCleared]);

      const isAllScalesEqualAndBalanced = () => {
        if (!multiScales || multiScales.length < 2) return false;
        const first = multiScales[0];
        if (first.left.x === 0 && first.left.num === 0 && first.right.x === 0 && first.right.num === 0) return false;
        const wL = first.left.x * secretX + first.left.num;
        const wR = first.right.x * secretX + first.right.num;
        if (wL !== wR) return false;
        return multiScales.every(s =>
          s.left.x === first.left.x &&
          s.left.num === first.left.num &&
          s.right.x === first.right.x &&
          s.right.num === first.right.num
        );
      };

      const handleAddEmptyScale = () => {
        if (isCleared || isAnimating) return;
        if (!multiScales) {
          if (leftWeight !== rightWeight) {
            SoundFX.error();
            setMsg("⚠️ 저울이 수평(=)일 때만 빈 저울을 가져와 나누어 담을 수 있어요! ([🔄 리셋]으로 수평을 맞춰보세요)");
            return;
          }
          SoundFX.divideMagic();
          if (lastActionKey !== 'split-session') {
            setMoves(prev => prev + 1);
            setLastActionKey('split-session');
          }
          setMultiScales([
            { left: { ...left }, right: { ...right } },
            { left: { x: 0, num: 0 }, right: { x: 0, num: 0 } }
          ]);
          setMsg("");
        } else {
          if (multiScales.length >= 4) {
            SoundFX.error();
            setMsg("⚠️ 빈 저울은 최대 4대까지만 놓을 수 있어요!");
            return;
          }
          SoundFX.divideMagic();
          setMultiScales(prev => [
            ...prev,
            { left: { x: 0, num: 0 }, right: { x: 0, num: 0 } }
          ]);
        }
      };

      const handleMultiScaleItemClick = (scaleIdx, side, type) => {
        if (!multiScales) return;
        const currentScale = multiScales[scaleIdx];
        const currentVal = currentScale[side][type];
        if (currentVal === 0) return;

        const sign = currentVal > 0 ? 1 : -1;
        SoundFX.moveItem();

        setMultiScales(prev => {
          const next = prev.map(s => ({ left: { ...s.left }, right: { ...s.right } }));
          let targetIdx = 0;

          if (scaleIdx === 0) {
            let minVal = Infinity;
            targetIdx = 1;
            for (let i = 1; i < next.length; i++) {
              const v = Math.abs(next[i][side][type]);
              if (v < minVal) { minVal = v; targetIdx = i; }
            }
          } else {
            targetIdx = 0;
          }

          next[scaleIdx][side][type] -= sign;
          next[targetIdx][side][type] += sign;
          return next;
        });
      };

      const confirmEqualSplit = () => {
        if (!isAllScalesEqualAndBalanced()) return;
        SoundFX.heavyDrop();
        const divisor = multiScales.length;
        const nextL = { ...multiScales[0].left };
        const nextR = { ...multiScales[0].right };
        setLeft(nextL);
        setRight(nextR);
        setHistory(prev => [...prev, {
          action: `저울 ${divisor}대에 똑같이 나눠 담기 (÷${divisor})`,
          eq: `${formatSide(nextL, isGiftBoxMode)} = ${formatSide(nextR, isGiftBoxMode)}`
        }]);
        setMultiScales(null);
        resetSelections();
        setMsg("");
      };

      const cancelSplitMode = () => {
        if (!multiScales) return;
        SoundFX.balloonFloat();
        const totalL = { x: 0, num: 0 }, totalR = { x: 0, num: 0 };
        multiScales.forEach(s => {
          totalL.x += s.left.x; totalL.num += s.left.num;
          totalR.x += s.right.x; totalR.num += s.right.num;
        });
        setLeft(totalL); setRight(totalR);
        setMultiScales(null);
        setMsg("");
      };

      const getSmartGuide = () => {
        if (multiScales) {
          const n = multiScales.length;
          if (isAllScalesEqualAndBalanced()) {
            return {
              badge: `✨ ${n}대 저울 공평 분배 성공!`,
              title: `모든 저울이 똑같이 [ ${formatSide(multiScales[0].left, isGiftBoxMode)} = ${formatSide(multiScales[0].right, isGiftBoxMode)} ] 로 수평을 이루었습니다!`,
              sub: "아래의 [✨ 똑같이 나눴어요! (저울 1대만 남기기)] 버튼을 눌러 마무리하세요."
            };
          }
          return {
            badge: `⚖️ 빈 저울에 직접 나누어 담기 (현재 저울 ${n}대)`,
            title: `1번 저울의 상자와 추를 터치(클릭)해서 ${n}대의 저울이 모두 똑같아지도록 옮겨 담아보세요!`,
            sub: "저울 대수가 더 필요하면 [➕ 빈 저울 더 가져오기]를 누르세요."
          };
        }
        if (stage === 0) {
          const t = TUTORIAL_STEPS[tutIdx];
          if (tutIdx === 3 && leftWeight !== rightWeight) {
            return {
              badge: "🚨 한쪽에서만 빼면 수평이 깨져요!",
              title: "오른쪽에서만 추를 빼면 저울이 기울어져 버려요!",
              sub: "[🔄 리셋]을 눌러 원래대로 돌린 뒤, [⚖️ 빈 저울 가져오기]로 양쪽을 똑같이 나누어 담아보세요!"
            };
          }
          return { badge: `🌟 등식의 성질 연습 (${t.step}/4)`, title: t.instruction, sub: t.subHint };
        }
        if (leftWeight !== rightWeight) {
          return {
            badge: "🚨 평형이 깨졌어요!",
            title: "저울이 기울어져 등식(=)이 깨졌습니다!",
            sub: "반대쪽 접시에도 똑같이 해주거나 [🔄 리셋] 후 다시 시도해 보세요."
          };
        }
        if (left.x !== 0 && right.x !== 0) {
          return {
            badge: "🎯 1단계 목표: x 상자 한쪽으로 모으기",
            title: "양쪽 접시에 모두 x 상자가 있습니다. 한쪽에만 x 상자가 남으려면 어떻게 해야 할까요?",
            sub: "하단에서 [① 대상]과 [② 개수]를 직접 선택한 뒤 x 상자를 덜어내 보세요."
          };
        }
        const xPlate = left.x !== 0 ? left : right;
        if (xPlate.num !== 0) {
          return {
            badge: "🎯 현재 목표: x 상자 옆의 방해꾼 없애기",
            title: "[📦 x 상자]만 혼자 남도록 같은 접시에 있는 숫자 추(또는 풍선)를 없애보세요!",
            sub: "어느 접시(대상)에서 몇 개(개수)를 더하거나 풍선(-)을 달아야 수평을 유지하며 없앨 수 있을까요?"
          };
        }
        if (Math.abs(xPlate.x) > 1) {
          return {
            badge: "🎯 마지막 목표: x 상자 1개의 무게 찾기",
            title: `접시에 x 상자가 여러 개 있습니다. 상자 1개의 무게를 알려면 저울이 총 몇 대 필요할까요?`,
            sub: "하단의 [⚖️ 빈 저울 가져오기]를 눌러 직접 나누어 담아보세요!"
          };
        }
        return {
          badge: "🎉 목표 달성!",
          title: `접시에 x 상자 1개만 남았습니다! x = ${secretX}`,
          sub: "양변에 똑같은 조작을 하여 미지수 x의 값을 구하는 것이 방정식을 푸는 것입니다."
        };
      };

      const triggerEffects = (sideMode, type, amount) => {
        const checkCancel = (oldVal, addVal) => (oldVal < 0 && addVal > 0) || (oldVal > 0 && addVal < 0);
        let lCancel = (sideMode === 'left' || sideMode === 'both') && checkCancel(left[type], amount);
        let rCancel = (sideMode === 'right' || sideMode === 'both') && checkCancel(right[type], amount);

        if (lCancel || rCancel) {
          SoundFX.zeroPairPoof();
          setPoofSide(lCancel && rCancel ? 'both' : (lCancel ? 'left' : 'right'));
          setTimeout(() => setPoofSide(null), 550);
        } else {
          if (amount > 0) SoundFX.heavyDrop(); else SoundFX.balloonFloat();
        }
      };

      const handleAction = (type, dir, customSide = null, customStep = null) => {
        if (multiScales || isCleared || isAnimating) return;
        setMsg("");

        const sMode = customSide || targetSide;
        const actualStep = customStep !== null ? customStep : stepSize;

        if (!sMode || !actualStep) {
          SoundFX.error();
          setMsg("⚠️ 먼저 하단에서 [① 대상(어느 접시)]과 [② 개수(몇 개)]를 직접 선택해 주세요!");
          return;
        }

        if (stage === 0 && tutIdx === 3 && type === 'num' && dir < 0) {
          if ((sMode === 'left' || sMode === 'both') && left.num < actualStep) {
            SoundFX.error();
            setMsg("💡 왼쪽 접시에는 숫자 추가 없어서 뺄 수 없어요! (우변만 빼면 저울이 기울어지겠죠? 빈 저울에 나누어 담아보세요!)");
            return;
          }
        }

        const amount = dir * actualStep;
        const nextL = (sMode === 'left' || sMode === 'both') ? { ...left, [type]: left[type] + amount } : left;
        const nextR = (sMode === 'right' || sMode === 'both') ? { ...right, [type]: right[type] + amount } : right;

        if (stage > 0 && nextL.x === 0 && nextR.x === 0) {
          SoundFX.error();
          setMsg("⚠️ 앗! 주인공인 [📦 x 상자]까지 전부 없애버리면 x의 무게를 구할 수 없어요!");
          return;
        }

        const currentKey = `${sMode}-${type}-${dir > 0 ? 'pos' : 'neg'}`;
        if (lastActionKey !== currentKey) {
          setMoves(prev => prev + 1);
          setLastActionKey(currentKey);
        }

        const itemLabel = type === 'x' ? `${Math.abs(amount) === 1 ? '' : Math.abs(amount)}x` : Math.abs(amount);
        const sideLabel = sMode === 'both' ? '양변에' : (sMode === 'left' ? '좌변에' : '우변에');
        const actLabel = `${sideLabel} ${itemLabel} ${amount > 0 ? '더하기(+)' : '풍선 달아 빼기(-)'}`;
        const nLW = nextL.x * secretX + nextL.num;
        const nRW = nextR.x * secretX + nextR.num;
        const signStr = nLW === nRW ? '=' : (nLW > nRW ? '>' : '<');

        // ★ 양수 추(+1) 또는 양수 상자(+x)에 마이너스 풍선을 달아 빼는 경우: 0.6초간 풍선 매달림 후 펑!
        const isAddingBalloonToPosItem = 
          dir < 0 && 
          (((sMode === 'left' || sMode === 'both') && left[type] > 0) || 
           ((sMode === 'right' || sMode === 'both') && right[type] > 0));

        resetSelections();

        if (isAddingBalloonToPosItem) {
          setIsAnimating(true);
          SoundFX.balloonFloat();
          if (type === 'num') {
            setTempBalloons({
              left: (sMode === 'left' || sMode === 'both') ? actualStep : 0,
              right: (sMode === 'right' || sMode === 'both') ? actualStep : 0,
              leftX: 0, rightX: 0
            });
          } else {
            setTempBalloons({
              left: 0, right: 0,
              leftX: (sMode === 'left' || sMode === 'both') ? actualStep : 0,
              rightX: (sMode === 'right' || sMode === 'both') ? actualStep : 0
            });
          }

          setTimeout(() => {
            SoundFX.zeroPairPoof();
            setTempBalloons({ left: 0, right: 0, leftX: 0, rightX: 0 });
            setPoofSide(sMode);
            setTimeout(() => setPoofSide(null), 550);

            setLeft(nextL);
            setRight(nextR);
            setHistory(prev => [...prev, { action: actLabel, eq: `${formatSide(nextL, isGiftBoxMode)} ${signStr} ${formatSide(nextR, isGiftBoxMode)}` }]);
            setIsAnimating(false);
          }, 600);
        } else {
          triggerEffects(sMode, type, amount);
          setLeft(nextL);
          setRight(nextR);
          setHistory(prev => [...prev, { action: actLabel, eq: `${formatSide(nextL, isGiftBoxMode)} ${signStr} ${formatSide(nextR, isGiftBoxMode)}` }]);
        }
      };

      const handleItemDirectClick = (clickedSide, type, dir) => {
        if (type === 'x' && stage < 4) {
          SoundFX.error();
          setMsg("💡 상자는 클릭해서 그냥 없앨 수 없어요! 빈 저울을 가져와 나누어 담아보세요.");
          return;
        }
        handleAction(type, dir, clickedSide, 1);
      };

      const handleReset = () => {
        if (stage === 0) { loadTutorialStep(tutIdx); return; }
        if (initialState) {
          SoundFX.balloonFloat();
          setLeft({ ...initialState.left }); setRight({ ...initialState.right });
          resetSelections();
          setMoves(0); setLastActionKey(null); setMultiScales(null); setMsg("");
          setTempBalloons({ left: 0, right: 0, leftX: 0, rightX: 0 }); setIsAnimating(false);
          setHistory([{ action: "처음 주어진 방정식", eq: `${formatSide(initialState.left)} = ${formatSide(initialState.right)}` }]);
        }
      };

      const handleNextButton = () => {
        if (stage === 0) {
          if (tutIdx < TUTORIAL_STEPS.length - 1) {
            const nextIdx = tutIdx + 1;
            setTutIdx(nextIdx); loadTutorialStep(nextIdx);
          } else {
            setStage(1);
          }
        } else {
          generateProblem(stage);
        }
      };

      const currentStars = stage === 0 ? 3 : getEarnedStars(moves);
      const guide = getSmartGuide();
      const splitReady = isAllScalesEqualAndBalanced();
      const isActionReady = !!targetSide && !!stepSize && !isAnimating;

      return (
        <div className="game-window">
          {/* 1. 상단 바 */}
          <div className="header-bar">
            <div className="brand">⚖️ 양팔저울 방정식</div>
            <div className="stage-nav">
              {STAGES.map(s => (
                <button
                  key={s.id}
                  className={`stage-pill ${s.isTutorial ? 'tutorial-pill' : ''} ${stage === s.id ? 'active' : ''}`}
                  onClick={() => setStage(s.id)}
                >
                  {s.name}
                </button>
              ))}
            </div>
            <div className="header-stats">
              <div className="stat-chip"><span style={{color:'#facc15'}}>★</span> {totalStars}</div>
              <div className="stat-chip">🔥 {streak}</div>
              <button className="icon-btn" onClick={() => setShowCustomModal(true)} title="직접 방정식 문제 만들기">
                ✏️ 문제 만들기
              </button>
              <button className="icon-btn mobile-only-btn" onClick={() => setShowMobileNote(true)}>
                📓 노트({history.length - 1})
              </button>
              <button className="icon-btn" onClick={() => { SoundFX.muted = !muted; setMuted(!muted); }}>
                {muted ? '🔇' : '🔊'}
              </button>
            </div>
          </div>

          {/* 2. 메인 워크스페이스 */}
          <div className="main-workspace">
            <div className="canvas-section">
              
              {/* 상단 HUD */}
              <div className="canvas-hud">
                <div className={`goal-guide-card ${stage === 0 ? 'tutorial-card' : ''} ${multiScales ? 'split-card' : ''}`}>
                  <div className="goal-badge">{guide.badge}</div>
                  <div className="goal-title">{guide.title}</div>
                  <div className="goal-sub">💡 {guide.sub}</div>
                </div>

                <div className="hud-right-group">
                  <div className="equation-hud">
                    <span>{formatSide(left, isGiftBoxMode)}</span>
                    <span className={`sign-badge ${leftWeight === rightWeight ? 'equal' : 'unequal'}`}>
                      {leftWeight === rightWeight ? '=' : (leftWeight > rightWeight ? '>' : '<')}
                    </span>
                    <span>{formatSide(right, isGiftBoxMode)}</span>
                  </div>

                  <div className="moves-hud">
                    <div className="count">이동: {moves}회</div>
                    <div className="target">★3 목표: {optimalMoves}회</div>
                    <div style={{letterSpacing:'2px', fontSize:'0.9rem'}}>
                      <span style={{color: currentStars >= 1 ? '#f59e0b' : '#cbd5e1'}}>★</span>
                      <span style={{color: currentStars >= 2 ? '#f59e0b' : '#cbd5e1'}}>★</span>
                      <span style={{color: currentStars >= 3 ? '#f59e0b' : '#cbd5e1'}}>★</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* 클리어 시 상단 팝업 */}
              {isCleared && (
                <div className="clear-floating-banner">
                  <div style={{fontSize:'1.6rem'}}>{currentStars === 3 ? "⭐⭐⭐" : currentStars === 2 ? "⭐⭐☆" : "⭐☆☆"}</div>
                  <div style={{maxWidth: '420px'}}>
                    <div style={{fontWeight:900, color:'#065f46', fontSize:'0.92rem'}}>
                      {stage === 0 ? TUTORIAL_STEPS[tutIdx].clearComment : `정답입니다! 미지수 x의 무게는 ${secretX} 입니다! 🎉`}
                    </div>
                    {stage > 0 && (
                      <div style={{fontSize:'0.76rem', color:'#047857', marginTop:'2px'}}>
                        이동 기록: {moves}회 (목표 {optimalMoves}회)
                      </div>
                    )}
                  </div>
                  {stage > 0 && currentStars < 3 && (
                    <button className="dock-btn d-xpos" onClick={handleReset}>🔄 별3 재도전</button>
                  )}
                  <button className="dock-btn pulse-highlight" style={{background:'#16a34a', color:'white', padding:'8px 14px'}} onClick={handleNextButton}>
                    {stage === 0 && tutIdx < 3 ? `다음 미션 (${tutIdx + 2}/4) ▶` : (stage === 0 ? "🚀 Stage 1 출발! ▶" : "다음 문제 ▶")}
                  </button>
                </div>
              )}

              {/* 에러/안내 메시지 */}
              {msg && !isCleared && (
                <div style={{position:'absolute', top: isMobile ? '115px' : '92px', maxWidth:'92%', textAlign:'center', background:'#fef2f2', border:'2px solid #f87171', color:'#dc2626', padding:'7px 14px', borderRadius:'16px', fontWeight:800, fontSize:'0.8rem', zIndex:20, boxShadow:'0 4px 12px rgba(0,0,0,0.12)'}}>
                  {msg}
                </div>
              )}

              {/* 중앙 양팔저울 무대 */}
              <div className="scale-stage-center">
                {!multiScales ? (
                  <ScaleView 
                    left={left} right={right} tiltAngle={tiltAngle}
                    isCleared={isCleared} secretX={secretX}
                    poofSide={poofSide} tempBalloons={tempBalloons}
                    onItemClick={handleItemDirectClick}
                    stage={stage} isGiftBox={isGiftBoxMode}
                    scaleFactor={mainScaleFactor}
                  />
                ) : (
                  <div className="multi-scales-workspace">
                    <div className="mini-scales-container">
                      {multiScales.map((s, idx) => {
                        const sLW = s.left.x * secretX + s.left.num;
                        const sRW = s.right.x * secretX + s.right.num;
                        const sTilt = Math.max(-18, Math.min(18, (sRW - sLW) * 4));
                        const sSign = sLW === sRW ? '=' : (sLW > sRW ? '>' : '<');

                        return (
                          <div key={idx} className={`mini-scale-card ${idx === 0 ? 'source-card' : ''} ${splitReady ? 'equal-ready' : ''}`}>
                            <div className="mini-badge">
                              {idx === 0 ? "📦 1번 저울 (터치➔이동)" : `⚖️ ${idx + 1}번 저울 (터치➔복귀)`}
                            </div>
                            <div style={{ fontWeight: 900, fontSize: '0.88rem', marginTop: '3px', color: sLW === sRW ? '#059669' : '#dc2626' }}>
                              {formatSide(s.left, isGiftBoxMode)} {sSign} {formatSide(s.right, isGiftBoxMode)}
                            </div>
                            <ScaleView
                              left={s.left} right={s.right} tiltAngle={sTilt}
                              stage={stage} isGiftBox={isGiftBoxMode} showRoleTag={false}
                              scaleFactor={miniScaleFactor}
                              onItemClick={(side, type) => handleMultiScaleItemClick(idx, side, type)}
                            />
                          </div>
                        );
                      })}
                    </div>

                    <div className="split-control-bar">
                      <button className="dock-btn d-div" disabled={multiScales.length >= 4} onClick={handleAddEmptyScale}>
                        ➕ 빈 저울 더 가져오기 ({multiScales.length}대)
                      </button>
                      {splitReady && (
                        <button className="dock-btn d-green pulse-highlight" onClick={confirmEqualSplit}>
                          ✨ 똑같이 나눴어요! (저울 1대만 남기기)
                        </button>
                      )}
                      <button className="dock-btn d-util" onClick={cancelSplitMode}>
                        ✖ 나누기 취소
                      </button>
                    </div>
                  </div>
                )}
              </div>

              {/* 3. 하단 플로팅 액션 독 */}
              <div className="floating-dock">
                <div className={`dock-section ${!targetSide && !multiScales && !isCleared ? 'needs-select' : ''}`}>
                  <span className="dock-label">① 대상:</span>
                  <button
                    className={`sync-chip ${targetSide === 'both' ? 'active' : ''}`}
                    disabled={!!multiScales || isCleared || isAnimating}
                    onClick={() => { SoundFX.selectPop(); setTargetSide('both'); setMsg(""); }}
                  >
                    🔗 양변 동시
                  </button>
                  <button
                    className={`num-chip ${targetSide === 'left' ? 'active' : ''}`}
                    disabled={!!multiScales || isCleared || isAnimating}
                    style={{width:'auto', padding:'0 7px'}}
                    onClick={() => { SoundFX.selectPop(); setTargetSide('left'); setMsg(""); }}
                  >
                    좌변만
                  </button>
                  <button
                    className={`num-chip ${targetSide === 'right' ? 'active' : ''}`}
                    disabled={!!multiScales || isCleared || isAnimating}
                    style={{width:'auto', padding:'0 7px'}}
                    onClick={() => { SoundFX.selectPop(); setTargetSide('right'); setMsg(""); }}
                  >
                    우변만
                  </button>
                </div>

                <div className={`dock-section ${!stepSize && !multiScales && !isCleared ? 'needs-select' : ''}`}>
                  <span className="dock-label">② 개수:</span>
                  {[1, 2, 3, 4, 5, 6].map(n => (
                    <button
                      key={n}
                      className={`num-chip ${stepSize === n ? 'active' : ''}`}
                      disabled={!!multiScales || isCleared || isAnimating}
                      onClick={() => { SoundFX.selectPop(); setStepSize(n); setMsg(""); }}
                    >
                      {n}
                    </button>
                  ))}
                </div>

                <div className="dock-section">
                  <span className="dock-label">③ 실행:</span>
                  <button
                    className={`dock-btn d-pos ${!isActionReady ? 'locked-action' : ''}`}
                    disabled={!!multiScales || isCleared || isAnimating}
                    onClick={() => handleAction('num', 1)}
                  >
                    🏋️ +{stepSize || '?'} 추
                  </button>
                  <button
                    className={`dock-btn d-neg ${!isActionReady ? 'locked-action' : ''}`}
                    disabled={!!multiScales || isCleared || isAnimating}
                    onClick={() => handleAction('num', -1)}
                  >
                    🎈 -{stepSize || '?'} 풍선(빼기)
                  </button>
                </div>

                {(stage >= 4 || right.x !== 0) && (
                  <div className="dock-section">
                    <button
                      className={`dock-btn d-xpos ${!isActionReady ? 'locked-action' : ''}`}
                      disabled={!!multiScales || isCleared || isAnimating}
                      onClick={() => handleAction('x', 1)}
                    >
                      📦 +{stepSize || '?'}x
                    </button>
                    <button
                      className={`dock-btn d-xneg ${!isActionReady ? 'locked-action' : ''}`}
                      disabled={!!multiScales || isCleared || isAnimating}
                      onClick={() => handleAction('x', -1)}
                    >
                      📦 -{stepSize || '?'}x
                    </button>
                  </div>
                )}

                {(stage >= 2 || left.x > 1 || (stage === 0 && tutIdx === 3)) && (
                  <div className="dock-section">
                    <button
                      className="dock-btn d-div"
                      disabled={isCleared || isAnimating || (multiScales && multiScales.length >= 4)}
                      onClick={handleAddEmptyScale}
                    >
                      ⚖️ 빈 저울 가져오기
                    </button>
                  </div>
                )}

                <div className="dock-section">
                  <button className="dock-btn d-util" disabled={isAnimating} onClick={handleReset}>🔄 리셋</button>
                  {stage > 0 && (
                    <button className="dock-btn d-util" disabled={isAnimating} onClick={() => generateProblem(stage)}>🎲 새 문제</button>
                  )}
                </div>
              </div>

            </div>

            {/* 우측 사이드바: 실시간 수학 풀이 공책 (모바일에서는 버튼 클릭 시 오버레이로 열림) */}
            <div className={`notebook-sidebar ${showMobileNote ? 'mobile-open' : ''}`}>
              <div className="notebook-header">
                <span>📓 실시간 풀이 노트</span>
                <div style={{display:'flex', alignItems:'center', gap:'8px'}}>
                  <span style={{fontSize:'0.75rem', color:'#64748b'}}>{history.length - 1}단계</span>
                  {isMobile && (
                    <button className="dock-btn d-util" style={{padding:'4px 10px'}} onClick={() => setShowMobileNote(false)}>
                      ✖ 닫기
                    </button>
                  )}
                </div>
              </div>
              <div className="notebook-body">
                {history.map((item, idx) => (
                  <div key={idx} className="log-step" style={{borderLeftColor: idx === 0 ? '#64748b' : '#3b82f6'}}>
                    <div className="log-action">{idx === 0 ? "📌 시작 상태" : `Step ${idx}. ${item.action}`}</div>
                    <div className="log-eq">{item.eq}</div>
                  </div>
                ))}
                {isCleared && (stage > 0 || isGiftBoxMode) && (
                  <div className="log-step" style={{borderLeftColor:'#16a34a', background:'#f0fdf4'}}>
                    <div className="log-action" style={{color:'#15803d'}}>🎉 상자 1개의 무게 구하기 완료!</div>
                    <div className="log-eq" style={{color:'#16a34a'}}>
                      ∴ {isGiftBoxMode ? '🎁' : 'x'} = {secretX}
                    </div>
                  </div>
                )}
              </div>
              <div className="notebook-footer">
                💡 <b>조작 방법:</b> 하단에서 <b>① 대상</b>과 <b>② 개수</b>를 스스로 생각하여 선택한 뒤 <b>③ 실행 버튼</b>을 누르세요!
              </div>
            </div>

          </div>

          {/* ✏️ 직접 문제 만들기 모달 */}
          {showCustomModal && (
            <div className="modal-backdrop" onClick={() => setShowCustomModal(false)}>
              <div className="modal-card" onClick={e => e.stopPropagation()}>
                <h3>✏️ 내 방정식 문제 직접 만들기</h3>
                <p style={{fontSize:'0.8rem', color:'#64748b', margin:'0 0 12px 0'}}>
                  좌변의 x 계수와 상수항, 우변의 x 계수, 그리고 정답(x)을 입력하면 우변의 숫자가 자동으로 맞춰집니다!
                </p>
                <div className="custom-input-row">
                  <input type="number" min="1" max="4" value={customForm.lx} onChange={e => setCustomForm({...customForm, lx: e.target.value})} />
                  <span>x + (</span>
                  <input type="number" min="-5" max="6" value={customForm.lnum} onChange={e => setCustomForm({...customForm, lnum: e.target.value})} />
                  <span>) = </span>
                  <input type="number" min="0" max="3" value={customForm.rx} onChange={e => setCustomForm({...customForm, rx: e.target.value})} />
                  <span>x + <b>?</b></span>
                </div>
                <div className="custom-input-row" style={{background:'#fef3c7'}}>
                  <span>숨겨진 정답 x = </span>
                  <input type="number" min="1" max="6" value={customForm.xval} onChange={e => setCustomForm({...customForm, xval: e.target.value})} />
                </div>
                <div style={{display:'flex', justifyContent:'flex-end', gap:'8px', marginTop:'14px'}}>
                  <button className="dock-btn d-util" onClick={() => setShowCustomModal(false)}>취소</button>
                  <button className="dock-btn d-pos" onClick={applyCustomProblem}>⚖️ 이 문제로 저울 세팅하기</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
